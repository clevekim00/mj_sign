# SignGemma-compatible demo profile.
#
# This profile wires Spring Boot to the local sign_gemma_mock server for
# sign-to-text and keeps T2S/STS on the Spring Boot mock provider, because
# official SignGemma text-to-motion weights/specs are not available yet.

sign.gpu.provider=http
sign.gpu.base-url=http://localhost:8000
sign.gpu.infer-path=/api/v2/recognize
sign.gpu.health-path=/ready

sign.synthesis.provider=mock
sign.synthesis.asr-provider=mock

sign.language.default-locale=en-US
sign.language.default-sign-language=asl
sign.language.default-model-profile=sign-gemma
