name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  JAVA_VERSION: "21"
  FLUTTER_VERSION: "3.38.5"
  DART_VERSION: "3.10.4"
  PYTHON_VERSION: "3.11"

jobs:
  analysis-index:
    name: Folder analysis indexes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify generated folder indexes
        run: python3 scripts/project_analysis_harness.py check

  spring:
    name: Spring Boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sign/backend/bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Test
        run: ./gradlew test

  flutter:
    name: Flutter Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sign/embedded
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show pinned Flutter toolchain
        run: |
          flutter --version
          dart --version
          dart --version 2>&1 | grep "Dart SDK version: $DART_VERSION"

      - name: Install package dependencies
        run: flutter pub get

      - name: Analyze package
        run: flutter analyze

      - name: Install example dependencies
        working-directory: sample/embedded/flutter_app
        run: flutter pub get

      - name: Analyze example
        working-directory: sample/embedded/flutter_app
        run: flutter analyze

      - name: Test example
        working-directory: sample/embedded/flutter_app
        run: flutter test

  python-contracts:
    name: Python Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: sample/backend/model_server/requirements.txt

      - name: Install mock dependencies
        run: python -m pip install -r sample/backend/model_server/requirements.txt

      - name: Import mock app
        working-directory: sample/backend/model_server
        run: python -c "import main; print(main.health_check()['status'])"

      - name: Run model server contract tests
        working-directory: sample/backend/model_server
        run: python -m unittest discover -s tests -v

      - name: Run eval fixtures
        run: python scripts/run_eval_fixtures.py --json
