name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  JAVA_VERSION: "21"
  FLUTTER_VERSION: "3.38.5"
  DART_VERSION: "3.10.4"
  PYTHON_VERSION: "3.11"

jobs:
  spring:
    name: Spring Boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sign_bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Test
        run: ./gradlew test

  flutter:
    name: Flutter Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slr_input_kit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show pinned Flutter toolchain
        run: |
          flutter --version
          dart --version
          dart --version 2>&1 | grep "Dart SDK version: $DART_VERSION"

      - name: Install package dependencies
        run: flutter pub get

      - name: Analyze package
        run: flutter analyze

      - name: Install example dependencies
        working-directory: slr_input_kit/example
        run: flutter pub get

      - name: Analyze example
        working-directory: slr_input_kit/example
        run: flutter analyze

      - name: Test example
        working-directory: slr_input_kit/example
        run: flutter test

  python-contracts:
    name: Python Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: sign_gemma_mock/requirements.txt

      - name: Install mock dependencies
        run: python -m pip install -r sign_gemma_mock/requirements.txt

      - name: Import mock app
        working-directory: sign_gemma_mock
        run: python -c "import main; print(main.health_check()['status'])"

      - name: Run eval fixtures
        run: python scripts/run_eval_fixtures.py --json
