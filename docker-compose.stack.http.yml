services:
  mock-gpu:
    build:
      context: ./sign_gemma_mock
    container_name: mj-sign-mock-gpu-http
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  bridge:
    image: gradle:8.10.2-jdk21
    container_name: mj-sign-bridge-http
    working_dir: /workspace/sign_bridge
    volumes:
      - .:/workspace
      - gradle-cache:/home/gradle/.gradle
    command: >
      /bin/sh -lc
      "./gradlew bootRun --args='--sign.gpu.provider=http --sign.gpu.base-url=http://mock-gpu:8000 --sign.gpu.health-path=/ready'"
    depends_on:
      mock-gpu:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  gradle-cache:
