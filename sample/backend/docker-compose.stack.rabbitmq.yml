services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mj-sign-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  mock-gpu:
    build:
      context: ./model_server
    container_name: mj-sign-mock-gpu
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  bridge:
    image: gradle:8.10.2-jdk21
    container_name: mj-sign-bridge-rabbitmq
    working_dir: /workspace/sign/backend/bridge
    volumes:
      - ../..:/workspace
      - gradle-cache:/home/gradle/.gradle
    command: >
      /bin/sh -lc
      "./gradlew bootRun --args='--spring.profiles.active=rabbitmq --sign.gpu.base-url=http://mock-gpu:8000 --spring.rabbitmq.host=rabbitmq --spring.rabbitmq.port=5672'"
    depends_on:
      - rabbitmq
      - mock-gpu
    ports:
      - "8080:8080"

volumes:
  gradle-cache:
