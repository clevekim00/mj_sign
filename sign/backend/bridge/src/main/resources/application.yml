spring:
  application:
    name: sign-bridge
  # Swagger/OpenAPI configuration
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
    api-docs:
      path: /v3/api-docs
  main:
    banner-mode: "off"
  # Spring AI Configuration
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma4:latest
          temperature: 0.7

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ${sign.gpu.queue-consumer-group}
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  rabbitmq:
    host: localhost
    port: 5672

sign:
  language:
    default-locale: ko-KR
    default-sign-language: ksl
    default-model-profile: sign-gemma-ko
    protocol-version: signbridge-model-v1
    sign-language-by-locale-language:
      ko: ksl
      en: asl
      ja: jsl
      zh: csl
      fr: lsf
      de: dgs
      es: lse
    model-profile-by-sign-language:
      ksl: sign-gemma-ko
      asl: sign-gemma
      jsl: sign-gemma-ja
      csl: sign-gemma-zh
      lsf: sign-gemma-fr
      dgs: sign-gemma-de
      lse: sign-gemma-es
  gpu:
    provider: http
    base-url: http://localhost:8000
    infer-path: /api/v2/recognize
    health-path: /ready
    grpc-target: dns:///localhost:50051
    queue-transport: in-memory
    queue-broker-mode: loopback
    queue-topic: sign.inference.requests
    queue-request-topic: sign.inference.requests
    # Instance-scoped reply destination prevents competing Bridge replicas from
    # consuming and discarding another replica's correlated response.
    queue-result-topic: ${SIGN_BRIDGE_RESULT_QUEUE:sign.inference.results.${HOSTNAME:local}}
    queue-consumer-group: sign-bridge
    queue-exchange: sign.inference
    queue-routing-key: sign.inference.request
    queue-result-routing-key: ${SIGN_BRIDGE_RESULT_ROUTING_KEY:sign.inference.result.${HOSTNAME:local}}
    queue-timeout-ms: 5000
    queue-publish-timeout-ms: 3000
    queue-idempotency-ttl-ms: 300000
    queue-idempotency-max-entries: 10000
    queue-max-attempts: 3
    queue-retry-backoff-ms: 500
    queue-dlq-topic: sign.inference.requests.dlq
    queue-dlq-routing-key: sign.inference.request.dlq
    timeout-ms: 2000
    probe-timeout-ms: 1000
  synthesis:
    provider: mock
    asr-provider: mock
    base-url: http://localhost:8010
    asr-base-url: http://localhost:8011
    synthesize-path: /api/v2/sign/synthesize
    asr-path: /api/v2/speech/transcribe
    output-format: landmarks
    protocol-version: signbridge-synthesis-v1
    timeout-ms: 3000
  websocket:
    allowed-origin-patterns: "http://localhost:*,http://127.0.0.1:*,tauri://localhost,http://tauri.localhost"
    max-binary-message-bytes: 1048576
    max-session-id-length: 128
    max-messages-per-second: 60
    max-points-per-landmark-group: 512
    max-absolute-coordinate: 10.0
    # Set SIGN_BRIDGE_WS_TOKEN in production. Blank keeps local samples compatible.
    authentication-token: ${SIGN_BRIDGE_WS_TOKEN:}
  window:
    min-frames: 8
    max-buffered-frames: 24
    idle-timeout-ms: 1200
    flush-threads: 1
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 16
    pending-per-session-capacity: 4
