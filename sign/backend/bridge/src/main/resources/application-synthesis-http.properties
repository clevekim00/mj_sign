# Enables external ASR and SignGemma-compatible Text-to-Sign providers.
#
# Example:
#   ./gradlew bootRun --args='--spring.profiles.active=synthesis-http'
#
# Expected ASR endpoint:
#   POST ${sign.synthesis.asr-base-url}${sign.synthesis.asr-path}
#   request:  SpeechRecognitionRequest
#   response: SpeechRecognitionResult
#
# Expected synthesis endpoint:
#   POST ${sign.synthesis.base-url}${sign.synthesis.synthesize-path}
#   request:  SignSynthesisRequest
#   response: SignSynthesisResult
sign.synthesis.provider=http
sign.synthesis.asr-provider=http
sign.synthesis.base-url=http://localhost:8010
sign.synthesis.asr-base-url=http://localhost:8011
sign.synthesis.synthesize-path=/api/v2/sign/synthesize
sign.synthesis.asr-path=/api/v2/speech/transcribe
sign.synthesis.output-format=landmarks
sign.synthesis.protocol-version=signbridge-synthesis-v1
sign.synthesis.timeout-ms=5000
